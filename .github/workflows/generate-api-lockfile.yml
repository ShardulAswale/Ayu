name: Generate API dependency lockfile
on:
  push:
    branches:
      - feature/core-care-workflows-security
    paths:
      - .github/workflows/generate-api-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile
        run: npm --prefix apps/api install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducibility
        run: npm --prefix apps/api ci --no-audit --no-fund
      - name: Build backend
        run: npm --prefix apps/api run build
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock API dependencies for reproducible builds"
            git push
          fi
