name: Ayu Passive Web Security Baseline
on:
  push:
    branches:
      - feature/core-care-workflows-security
    paths:
      - .github/workflows/passive-security-scan.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  passive-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline for public development frontend (no credentials)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://ayu.shardulaswale-cloudflare.workers.dev'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-m 2'
  passive-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline for public development API (no credentials)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://ayu-sdli.onrender.com'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-m 2'
